name: frontend-ci

# トリガー（いつ実行するか）
on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
  pull_request:
    branches: [main]
    paths:
      - "frontend/**"

# ジョブの定義（実行する内容）
jobs:
  build:
    runs-on: ubuntu-latest
    # frontend ディレクトリ内でコマンドを実行する
    defaults:
      run:
        working-directory: frontend
    steps:
      # リポジトリのコードを取得
      - uses: actions/checkout@v4

      # Node.js をセットアップ
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # 依存をインストール（package-lock.json 通りに厳密に入れる）
      - run: npm ci

      # ESLint でコード規約チェック
      - run: npm run lint

      # TypeScript の型チェック＋ビルド
      - run: npm run build
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
  deploy:
    # build ジョブが成功したときだけ実行
    needs: build
    # main への push のときだけデプロイ（pull_request では実行しない）
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run build
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}

      # AWS 認証情報を環境変数として設定（GitHub Secrets から取得）
      - name: Deploy to S3
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ap-northeast-1
        run: aws s3 sync dist/ s3://practice001-frontend-325054522536/ --delete
