name: frontend-ci

# トリガー（いつ実行するか）
on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
  pull_request:
    branches: [main]
    paths:
      - "frontend/**"

# ジョブの定義（実行する内容）
jobs:
  build:
    runs-on: ubuntu-latest
    # frontend ディレクトリ内でコマンドを実行する
    defaults:
      run:
        working-directory: frontend
    steps:
      # リポジトリのコードを取得
      - uses: actions/checkout@v4

      # Node.js をセットアップ
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # 依存をインストール（package-lock.json 通りに厳密に入れる）
      - run: npm ci

      # ESLint でコード規約チェック
      - run: npm run lint

      # TypeScript の型チェック＋ビルド
      - run: npm run build
